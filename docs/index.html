<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSeek Harness Desktop - 下载</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 800px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 40px;
            font-weight: bold;
        }

        h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 16px;
        }

        .version-info {
            text-align: center;
            margin-bottom: 30px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 10px;
        }

        .version {
            font-size: 18px;
            font-weight: bold;
            color: #667eea;
        }

        .release-date {
            color: #888;
            font-size: 14px;
            margin-top: 5px;
        }

        .download-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .download-card {
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .download-card:hover {
            border-color: #667eea;
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.2);
        }

        .platform-icon {
            width: 60px;
            height: 60px;
            margin: 0 auto 15px;
            background: #f0f0f0;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }

        .platform-name {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .download-type {
            color: #888;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .download-count {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            color: #667eea;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .download-count svg {
            width: 16px;
            height: 16px;
        }

        .download-btn {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.2s ease;
        }

        .download-btn:hover {
            transform: scale(1.05);
        }

        .download-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 15px;
            margin-bottom: 30px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 28px;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            color: #888;
            font-size: 14px;
            margin-top: 5px;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .feature {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 10px;
        }

        .feature-icon {
            color: #667eea;
            font-size: 20px;
        }

        .feature-text {
            color: #333;
            font-size: 14px;
        }

        .footer {
            text-align: center;
            color: #888;
            font-size: 14px;
        }

        .footer a {
            color: #667eea;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        .loading {
            text-align: center;
            color: #888;
            padding: 40px;
        }

        .error {
            text-align: center;
            color: #e74c3c;
            padding: 20px;
            background: #fdf2f2;
            border-radius: 10px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 22px;
            }

            .stats {
                flex-direction: column;
                gap: 20px;
            }

            .download-section {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">DSH</div>
            <h1>DeepSeek Harness Desktop</h1>
            <p class="subtitle">DeepSeek Harness 桌面客户端</p>
        </div>

        <div id="loading" class="loading">
            <p>正在加载版本信息...</p>
        </div>

        <div id="content" style="display: none;">
            <div class="version-info">
                <div class="version" id="version">v--</div>
                <div class="release-date" id="release-date">--</div>
            </div>

            <div class="stats">
                <div class="stat-item">
                    <div class="stat-value" id="total-downloads">--</div>
                    <div class="stat-label">总下载次数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="win-downloads">--</div>
                    <div class="stat-label">Windows 下载</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="mac-downloads">--</div>
                    <div class="stat-label">macOS 下载</div>
                </div>
            </div>

            <div class="download-section">
                <div class="download-card">
                    <div class="platform-icon">🪟</div>
                    <div class="platform-name">Windows</div>
                    <div class="download-type">安装版</div>
                    <div class="download-count">
                        <svg viewBox="0 0 16 16" fill="currentColor">
                            <path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/>
                            <path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3z"/>
                        </svg>
                        <span id="win-installer-count">--</span> 次
                    </div>
                    <button class="download-btn" id="win-installer-btn" disabled>下载安装版</button>
                </div>

                <div class="download-card">
                    <div class="platform-icon">🪟</div>
                    <div class="platform-name">Windows</div>
                    <div class="download-type">便携版</div>
                    <div class="download-count">
                        <svg viewBox="0 0 16 16" fill="currentColor">
                            <path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/>
                            <path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3z"/>
                        </svg>
                        <span id="win-portable-count">--</span> 次
                    </div>
                    <button class="download-btn" id="win-portable-btn" disabled>下载便携版</button>
                </div>

                <div class="download-card">
                    <div class="platform-icon">🍎</div>
                    <div class="platform-name">macOS</div>
                    <div class="download-type">便携版</div>
                    <div class="download-count">
                        <svg viewBox="0 0 16 16" fill="currentColor">
                            <path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/>
                            <path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3z"/>
                        </svg>
                        <span id="mac-count">--</span> 次
                    </div>
                    <button class="download-btn" id="mac-btn" disabled>下载 macOS 版</button>
                </div>
            </div>

            <div class="features">
                <div class="feature">
                    <span class="feature-icon">⚡</span>
                    <span class="feature-text">自动启动服务</span>
                </div>
                <div class="feature">
                    <span class="feature-icon">🎨</span>
                    <span class="feature-text">无边框设计</span>
                </div>
                <div class="feature">
                    <span class="feature-icon">🔄</span>
                    <span class="feature-text">自动更新</span>
                </div>
                <div class="feature">
                    <span class="feature-icon">💻</span>
                    <span class="feature-text">跨平台支持</span>
                </div>
            </div>
        </div>

        <div id="error" style="display: none;" class="error">
            <p>加载版本信息失败，请稍后重试</p>
        </div>

        <div class="footer">
            <p>
                <a href="https://github.com/lunar-landing/deepseek-harness-desktop" target="_blank">GitHub 仓库</a> · 
                <a href="https://github.com/lunar-landing/deepseek-harness-desktop/releases" target="_blank">所有版本</a>
            </p>
            <p style="margin-top: 10px;">© 2024 DeepSeek Harness Desktop</p>
        </div>
    </div>

    <script>
        const REPO_OWNER = 'lunar-landing';
        const REPO_NAME = 'deepseek-harness-desktop';
        const API_BASE = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}`;

        // 格式化数字
        function formatNumber(num) {
            if (num >= 1000000) {
                return (num / 1000000).toFixed(1) + 'M';
            }
            if (num >= 1000) {
                return (num / 1000).toFixed(1) + 'K';
            }
            return num.toString();
        }

        // 格式化日期
        function formatDate(dateStr) {
            const date = new Date(dateStr);
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // 获取最新版本信息
        async function fetchLatestRelease() {
            try {
                const response = await fetch(`${API_BASE}/releases/latest`);
                if (!response.ok) {
                    throw new Error('Failed to fetch release info');
                }
                return await response.json();
            } catch (error) {
                console.error('Error fetching release:', error);
                throw error;
            }
        }

        // 获取所有版本的下载统计
        async function fetchAllReleases() {
            try {
                const response = await fetch(`${API_BASE}/releases`);
                if (!response.ok) {
                    throw new Error('Failed to fetch releases');
                }
                return await response.json();
            } catch (error) {
                console.error('Error fetching releases:', error);
                throw error;
            }
        }

        // 计算下载次数
        function calculateDownloads(releases) {
            let totalDownloads = 0;
            let winInstallerDownloads = 0;
            let winPortableDownloads = 0;
            let macDownloads = 0;

            releases.forEach(release => {
                release.assets.forEach(asset => {
                    const count = asset.download_count || 0;
                    totalDownloads += count;

                    if (asset.name.includes('Setup') && asset.name.includes('.exe')) {
                        winInstallerDownloads += count;
                    } else if (asset.name.includes('Portable') && asset.name.includes('.zip')) {
                        winPortableDownloads += count;
                    } else if (asset.name.includes('macOS') && asset.name.includes('.zip')) {
                        macDownloads += count;
                    }
                });
            });

            return {
                total: totalDownloads,
                winInstaller: winInstallerDownloads,
                winPortable: winPortableDownloads,
                mac: macDownloads
            };
        }

        // 查找下载链接
        function findDownloadUrl(assets, pattern) {
            const asset = assets.find(a => a.name.includes(pattern));
            return asset ? asset.browser_download_url : null;
        }

        // 更新页面
        async function updatePage() {
            try {
                // 并行获取最新版本和所有版本
                const [latestRelease, allReleases] = await Promise.all([
                    fetchLatestRelease(),
                    fetchAllReleases()
                ]);

                // 更新版本信息
                document.getElementById('version').textContent = latestRelease.tag_name;
                document.getElementById('release-date').textContent = `发布于 ${formatDate(latestRelease.published_at)}`;

                // 计算下载次数
                const downloads = calculateDownloads(allReleases);
                document.getElementById('total-downloads').textContent = formatNumber(downloads.total);
                document.getElementById('win-downloads').textContent = formatNumber(downloads.winInstaller + downloads.winPortable);
                document.getElementById('mac-downloads').textContent = formatNumber(downloads.mac);

                // 更新各个下载按钮的计数
                document.getElementById('win-installer-count').textContent = formatNumber(downloads.winInstaller);
                document.getElementById('win-portable-count').textContent = formatNumber(downloads.winPortable);
                document.getElementById('mac-count').textContent = formatNumber(downloads.mac);

                // 设置下载链接
                const winInstallerUrl = findDownloadUrl(latestRelease.assets, 'Setup');
                const winPortableUrl = findDownloadUrl(latestRelease.assets, 'Portable');
                const macUrl = findDownloadUrl(latestRelease.assets, 'macOS');

                if (winInstallerUrl) {
                    document.getElementById('win-installer-btn').disabled = false;
                    document.getElementById('win-installer-btn').onclick = () => window.open(winInstallerUrl);
                }

                if (winPortableUrl) {
                    document.getElementById('win-portable-btn').disabled = false;
                    document.getElementById('win-portable-btn').onclick = () => window.open(winPortableUrl);
                }

                if (macUrl) {
                    document.getElementById('mac-btn').disabled = false;
                    document.getElementById('mac-btn').onclick = () => window.open(macUrl);
                }

                // 显示内容
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';

            } catch (error) {
                console.error('Error updating page:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
            }
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', updatePage);
    </script>
</body>
</html>
