name: Build and Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*' # 当推送版本标签时触发
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
        node-version: [22]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build for ${{ matrix.os }}
      run: npm run build:${{ matrix.os == 'windows-latest' && 'win' || 'mac' }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Create archive (Windows)
      if: matrix.os == 'windows-latest'
      run: powershell -Command "Compress-Archive -Path 'dist\DeepSeek-Harness-Desktop-win32-x64' -DestinationPath 'dist\DeepSeek-Harness-Desktop-Windows-x64.zip' -Force"
      shell: pwsh
        
    - name: Create archive (macOS)
      if: matrix.os == 'macos-latest'
      run: cd dist && zip -r "DeepSeek-Harness-Desktop-macOS-x64.zip" "DeepSeek-Harness-Desktop-darwin-x64"
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-${{ matrix.os }}-node${{ matrix.node-version }}
        path: dist/*.zip
        retention-days: 30

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        
    - name: Display structure of downloaded files
      run: ls -R artifacts/
      
    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        body: |
          ## Changes
          - 自动构建的跨平台版本
          
          ## 下载说明
          - Windows: 下载 `DeepSeek-Harness-Desktop-Windows-x64.zip`
          - macOS: 下载 `DeepSeek-Harness-Desktop-macOS-x64.zip`
          
          ## 安装说明
          1. 下载对应平台的压缩包
          2. 解压缩到任意目录
          3. 运行 `DeepSeek-Harness-Desktop.exe`（Windows）或 `DeepSeek-Harness-Desktop.app`（macOS）
          
          ## 系统要求
          - Windows 10 或更高版本
          - macOS 10.15 或更高版本
        draft: false
        prerelease: false
        
    - name: Upload Windows Release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./artifacts/release-windows-latest-node22/DeepSeek-Harness-Desktop-Windows-x64.zip
        asset_name: DeepSeek-Harness-Desktop-Windows-x64.zip
        asset_content_type: application/zip
        
    - name: Upload macOS Release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./artifacts/release-macos-latest-node22/DeepSeek-Harness-Desktop-macOS-x64.zip
        asset_name: DeepSeek-Harness-Desktop-macOS-x64.zip
        asset_content_type: application/zip