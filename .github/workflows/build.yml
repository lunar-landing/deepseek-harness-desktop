name: Build and Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*' # 当推送版本标签时触发
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch: # 允许手动触发

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build portable version
      run: npm run build:win
        
    - name: Create portable archive
      run: powershell -Command "Compress-Archive -Path 'dist\DeepSeek-Harness-Desktop-win32-x64' -DestinationPath 'dist\DeepSeek-Harness-Desktop-Windows-x64-Portable.zip' -Force"
      shell: pwsh
      
    - name: Build installer version
      run: npm run build:win:installer
      env:
        CSC_IDENTITY_AUTO_DISCOVERY: false
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-windows-latest
        path: |
          dist/*.zip
          dist/*.exe
        retention-days: 30

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build for macOS
      run: npm run build:mac
        
    - name: Create archive
      run: cd dist && zip -r "DeepSeek-Harness-Desktop-macOS-x64.zip" "DeepSeek-Harness-Desktop-darwin-x64"
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-macos-latest
        path: dist/*.zip
        retention-days: 30

  release:
    name: Create Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        
    - name: Display structure of downloaded files
      run: ls -R artifacts/
      
    - name: Create Release and Upload Assets
      uses: softprops/action-gh-release@v2
      with:
        name: Release ${{ github.ref_name }}
        body: |
          ## Changes
          - 自动构建的跨平台版本
          
          ## 下载说明
          
          ### Windows
          - `DeepSeek-Harness-Desktop-Windows-x64-Portable.zip` - 便携版（解压即用）
          - `DeepSeek-Harness-Desktop-Setup-*.exe` - 安装版（推荐）
          
          ### macOS
          - `DeepSeek-Harness-Desktop-macOS-x64.zip` - 便携版（解压即用）
          
          ## 安装说明
          
          ### Windows 便携版
          1. 下载 `.zip` 压缩包
          2. 解压缩到任意目录
          3. 运行 `DeepSeek-Harness-Desktop.exe`
          
          ### Windows 安装版
          1. 下载 `.exe` 安装程序
          2. 运行安装程序，按提示完成安装
          3. 从桌面或开始菜单启动
          
          ### macOS
          1. 下载 `.zip` 压缩包
          2. 解压缩到任意目录
          3. 运行 `DeepSeek-Harness-Desktop.app`
          
          ## 系统要求
          - Windows 10 或更高版本
          - macOS 10.15 或更高版本
        draft: false
        prerelease: false
        files: |
          ./artifacts/release-windows-latest/DeepSeek-Harness-Desktop-Windows-x64-Portable.zip
          ./artifacts/release-windows-latest/*.exe
          ./artifacts/release-macos-latest/DeepSeek-Harness-Desktop-macOS-x64.zip
