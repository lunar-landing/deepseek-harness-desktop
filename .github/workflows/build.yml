name: Build and Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*' # 当推送版本标签时触发
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
        node-version: [22]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build for ${{ matrix.os }}
      run: npm run build:${{ matrix.os == 'windows-latest' && 'win' || 'mac' }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 禁用代码签名
        CSC_IDENTITY_AUTO_DISCOVERY: false
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-${{ matrix.os }}-node${{ matrix.node-version }}
        path: |
          dist/*.exe
          dist/*.dmg
          dist/*.zip
        retention-days: 30

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        
    - name: Display structure of downloaded files
      run: ls -R artifacts/
      
    - name: Create Release and Upload Assets
      uses: softprops/action-gh-release@v2
      with:
        name: Release ${{ github.ref_name }}
        body: |
          ## Changes
          - 自动构建的跨平台版本
          
          ## 下载说明
          - Windows: 下载 `DeepSeek-Harness-Desktop-Setup-*.exe` 安装包
          - macOS: 下载 `DeepSeek-Harness-Desktop-*.dmg` 安装包
          
          ## 安装说明
          1. 下载对应平台的安装包
          2. 运行安装程序，按提示完成安装
          3. 安装完成后运行应用程序
          
          ## 系统要求
          - Windows 10 或更高版本
          - macOS 10.15 或更高版本
        draft: false
        prerelease: false
        files: |
          ./artifacts/release-windows-latest-node22/*.exe
          ./artifacts/release-macos-latest-node22/*.dmg